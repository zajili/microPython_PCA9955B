[build-system]
requires = [
    "setuptools",
    "wheel",
    "setuptools-scm",
]

[project]
name = "micropython-pca9955b"
description = "MicroPython helper library for the NXP 16-Channel I²C-Bus Constant-Current LED Driver"
version = "0.0.0+auto.0"
readme = "README.rst"
authors = [
    {name = "Noel Anderson"},
    {name = "zajili"}
]
urls = {Homepage = "https://github.com/zajili/microPython_PCA9955B"}
keywords = [
    "micropython",
    "pca9955b",
    "LED",
    "Driver",
    "I2C",
    "PWM",
    "Controller",
]
license = {text = "MIT"}
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[tool.setuptools]
packages = ["pca9955b"]
